<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Billing Counter</title>

<link rel="stylesheet"
href="../style.css">

<style>

.search-box{

    width:70%;

    margin:30px auto;

    text-align:center;

}

.search-box input{

    width:100%;

    padding:18px;

    font-size:22px;

    border-radius:12px;

    border:none;

    outline:none;

    text-align:center;

}

.search-btn{

    margin-top:25px;

}

</style>

</head>

<body>

<div class="container">

<div class="glass-card dashboard-card">

<h1>

💳 Billing Counter

</h1>

<br>

<div class="search-box">

<h2>

Enter Patient ID

</h2>

<br>

<input

type="text"

id="patientId"

placeholder="PAT-001"

autocomplete="off">

<br><br>

<button

class="search-btn"

onclick="searchPatient()">

🔍 Search Patient

</button>

</div>

</div>

</div>

<script>

function searchPatient(){

    const patientId =
    document.getElementById("patientId")
    .value
    .trim()
    .toUpperCase();

    if(patientId==""){

        alert("Please enter Patient ID");

        return;

    }

    window.location.href=
    "billing.html?patient="+
    encodeURIComponent(patientId);

}

document
.getElementById("patientId")
.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        searchPatient();

    }

});

</script>

</body>

</html>
