<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo Nano - Result</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{
    color:#fff;
    min-height:100vh;
    background:radial-gradient(circle at top,#0A4D8C 0%,#03172D 45%,#010C18 100%);
}
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
    linear-gradient(rgba(80,180,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(80,180,255,.08) 1px,transparent 1px);
    background-size:40px 40px;
    animation:grid 18s linear infinite;
}
@keyframes grid{
    from{transform:translateY(0)}
    to{transform:translateY(40px)}
}
.container{
    position:relative;
    z-index:2;
    width:92%;
    max-width:950px;
    margin:auto;
    padding:30px 0 40px;
}
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}
.brand{
    display:flex;
    align-items:center;
    gap:12px;
}
.logo{
    width:55px;
    height:55px;
    border-radius:50%;
    border:2px solid #4DD6FF;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    color:#7DE8FF;
}
.title{
    text-align:center;
    margin-bottom:25px;
}
.title h1{
    font-size:38px;
}
.title p{
    color:#B8E7FF;
    margin-top:8px;
}
.loading{
    text-align:center;
    padding:70px 20px;
}
.spinner{
    width:70px;
    height:70px;
    border:5px solid rgba(255,255,255,.1);
    border-top:5px solid #38BDF8;
    border-radius:50%;
    margin:auto;
    animation:spin 1s linear infinite;
}
@keyframes spin{
    to{transform:rotate(360deg)}
}
.panel{
    background:rgba(8,34,58,.85);
    border:1px solid rgba(56,189,248,.25);
    border-radius:18px;
    padding:22px;
    margin-bottom:18px;
}
.panel h2{
    color:#7DE8FF;
    margin-bottom:15px;
}
.department{
    font-size:30px;
    font-weight:bold;
}
.confidence{
    display:inline-block;
    margin-top:10px;
    padding:8px 15px;
    background:#0F766E;
    border-radius:30px;
    font-weight:bold;
}
.reason{
    margin-top:15px;
    line-height:1.7;
    color:#D7F3FF;
}
.doctor{
    background:#103A67;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
}
.doctor-name{
    font-size:18px;
    font-weight:600;
}
.spec{
    color:#9FD9FF;
}
.conditions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}
.tag{
    background:#0B3157;
    border:1px solid rgba(56,189,248,.25);
    padding:10px 16px;
    border-radius:30px;
}
.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
}
button{
    padding:14px 22px;
    border:none;
    border-radius:12px;
    font-weight:600;
    cursor:pointer;
}
.back{
    background:#173A63;
    color:#fff;
}
.next{
    background:linear-gradient(90deg,#1EA7FF,#2563EB);
    color:#fff;
}
.error{
    background:#7F1D1D;
    border-radius:12px;
    padding:18px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="brand">
<div class="logo">NN</div>
<div>
<h2>NEO NANO </h2>
<p>Medical Intelligence Engine</p>
</div>
</div>
</div>

<div class="title">
<h1>Recommendation</h1>
<p>Analyzing your information using the Hospital Medical Database</p>
</div>

<div id="loading" class="loading">
<div class="spinner"></div>
<p style="margin-top:18px;">Neo Nano is analyzing...</p>
</div>

<div id="result" style="display:none;">

<div class="panel">
<h2>Recommended Departments</h2>

<div id="departmentChoices" style="display:flex;flex-wrap:wrap;gap:12px;margin:15px 0;"></div>

<div class="department" id="department"></div>

<div class="confidence" id="confidence"></div>

<div class="reason" id="reason"></div>

</div>

<div class="panel">

<h2>Available Doctors</h2>

<div id="doctorList"></div>

</div>

<div class="panel">

<h2>Relevant Information</h2>

<div id="conditionList" class="conditions"></div>

</div>

<div class="buttons">

<button class="back" onclick="goBack()">Back</button>

<button class="next" onclick="goNext()">Continue</button>

</div>

</div>

<div id="error" style="display:none;" class="error">
Unable to connect to Neo Nano backend.
</div>

</div>

<script>

const symptoms=sessionStorage.getItem("neo_symptoms") || "";

if(symptoms===""){
    window.location.href="neo_nano_symptoms.html";
}

async function analyze(){

try{

const response=await fetch(
"http://127.0.0.1:5000/api/neo-nano/analyze",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
symptoms:symptoms,
symptom_context:JSON.parse(sessionStorage.getItem("neo_symptom_context") || "{}")
})
}
);

const data=await response.json();

if(!data.success){
throw new Error(data.message);
}

loading.style.display="none";
result.style.display="block";

department.innerText=data.department;

confidence.innerText="Confidence : "+data.confidence+"%";

reason.innerText=data.reason || "Department selected from the information provided.";

doctorList.innerHTML="";

if(data.doctors.length===0){

doctorList.innerHTML=`
<div class="doctor">
<div class="doctor-name">Doctor will be assigned</div>
<div class="spec">${data.department}</div>
</div>`;

}else{

data.doctors.forEach(doc=>{

doctorList.innerHTML += `
<div class="doctor">
<div class="doctor-name">${doc.name}</div>
<div class="spec">${doc.specialization}</div>
</div>`;

});

}

conditionList.innerHTML="";

data.conditions.forEach(c=>{

conditionList.innerHTML += `
<div class="tag">${c}</div>`;

});

const recommendations=(data.recommended_departments||[]).filter(Boolean).slice(0,3);
const choices=document.getElementById("departmentChoices");
choices.innerHTML="";
(recommendations.length?recommendations:[data.department]).forEach((dep,index)=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.textContent=(index===0?"Recommended: ":"")+dep;
    btn.style.padding="12px 16px";
    btn.style.borderRadius="10px";
    btn.style.border="1px solid rgba(56,189,248,.35)";
    btn.style.cursor="pointer";
    btn.onclick=async()=>{
        sessionStorage.setItem("neoNanoRecommendedDepartment",dep);
        sessionStorage.setItem("neoNanoSelectedDepartment",dep);
        if(window.MarykuttyVoice&&window.MarykuttyVoice.getSessionId()){
            try{await window.MarykuttyVoice.sendText(dep);return;}catch(e){console.warn("Voice department selection failed",e);}
        }
        window.location.href="appointments.html";
    };
    choices.appendChild(btn);
});

sessionStorage.setItem("neo_department",data.department);
sessionStorage.setItem("neoNanoRecommendedDepartment",recommendations[0]||data.department);
sessionStorage.setItem("neoNanoRecommendedDepartments",JSON.stringify(recommendations));
sessionStorage.setItem("neo_tests",JSON.stringify(data.tests || []));
sessionStorage.setItem("neo_doctors",JSON.stringify(data.doctors || []));
sessionStorage.setItem("neo_nano_result",JSON.stringify(data));

}catch(err){

console.log(err);

loading.style.display="none";
error.style.display="block";

}

}

async function goNext(){

const recommendations=(JSON.parse(sessionStorage.getItem("neoNanoRecommendedDepartments")||"[]")||[]).filter(Boolean);
const selected=recommendations[0]||sessionStorage.getItem("neoNanoRecommendedDepartment")||sessionStorage.getItem("neo_department");
if(selected){
    sessionStorage.setItem("neoNanoSelectedDepartment",selected);
    sessionStorage.setItem("neoNanoRecommendedDepartment",selected);
}

const isNewUser = sessionStorage.getItem("is_new_user") === "true" || !sessionStorage.getItem("patient");
if(isNewUser){
    window.location.href="new_patient.html";
}else{
    window.location.href="appointments.html";
}

}

function goBack(){

window.location.href="neo_nano_symptoms.html";

}

analyze();

</script>

<script src="../gemini_live.js"></script>
</body>
</html>
