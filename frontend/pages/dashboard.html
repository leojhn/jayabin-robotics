<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Appointment Confirmed</title><link rel="stylesheet" href="../style.css"><style>.confirm{max-width:850px;margin:auto;text-align:center}.ok{font-size:72px}.details{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left}.card{padding:18px;border-radius:14px;background:rgba(255,255,255,.12)}@media(max-width:700px){.details{grid-template-columns:1fr}}</style></head>
<body><div class="container"><div class="glass-card dashboard-card confirm"><div class="ok">✅</div><h1>Appointment Confirmed</h1><p id="message">Your appointment has been confirmed.</p><div class="details"><div class="card"><b>Patient</b><div id="patientName">-</div></div><div class="card"><b>Patient ID</b><div id="patientId">-</div></div><div class="card"><b>Department</b><div id="department">-</div></div><div class="card"><b>Doctor</b><div id="doctor">-</div></div><div class="card"><b>Date</b><div id="date">-</div></div><div class="card"><b>Time</b><div id="time">-</div></div><div class="card"><b>Token</b><div id="token">-</div></div><div class="card"><b>Appointment ID</b><div id="appointmentId">-</div></div></div><p style="margin-top:24px" id="nextMessage">Please wait while I take you to consultant billing.</p></div></div>
<script>
const p=JSON.parse(sessionStorage.getItem('patient')||'null')||{};
const a=JSON.parse(sessionStorage.getItem('appointment')||'null')||{};
const vals={patientName:p['PATIENT NAME']||'',patientId:p['PATIENT ID']||'',department:a['Department']||'',doctor:a['Doctor']||'',date:a['Date']||'',time:a['Time']||'',token:a['Token']||'',appointmentId:a['Appointment ID']||''};
Object.entries(vals).forEach(([k,v])=>document.getElementById(k).textContent=v||'-');
let advanced=false;
async function goToBilling(){if(advanced)return;advanced=true;document.getElementById('nextMessage').textContent='Opening consultant billing…';location.href='consultant_bill.html';}
document.addEventListener('DOMContentLoaded',()=>{setTimeout(goToBilling,2200);});
</script><script src="../gemini_live.js"></script>
</body></html>
