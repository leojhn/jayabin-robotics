<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Service Bill Receipt</title><link rel="stylesheet" href="../style.css"><style>
.receipt{width:700px;max-width:92%;margin:30px auto;background:#fff;color:#111;padding:35px;border-radius:15px;box-sizing:border-box}.receipt h1,.receipt h2{text-align:center}.receipt h2{color:#555}.receipt table{width:100%;border-collapse:collapse;margin-top:12px}.receipt td,.receipt th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.receipt td:last-child,.receipt th:last-child{text-align:right}.total{font-size:22px;font-weight:700;border-top:2px solid #111}.actions{text-align:center;margin-top:25px}.actions button{margin:6px}@media print{body{background:white}.receipt{width:100%;max-width:none;margin:0;padding:10px;border-radius:0;box-shadow:none}.actions{display:none}}
</style></head><body><div class="receipt"><h1>CITY HOSPITAL</h1><h2>SERVICE BILL / PAYMENT RECEIPT</h2><hr><table><tr><td>Receipt No</td><td id="receiptNo"></td></tr><tr><td>Date</td><td id="date"></td></tr><tr><td>Time</td><td id="time"></td></tr><tr><td>Patient ID</td><td id="patientId"></td></tr><tr><td>Patient Name</td><td id="patientName"></td></tr><tr><td>Appointment ID</td><td id="appointmentId"></td></tr><tr><td>Department</td><td id="department"></td></tr><tr><td>Consultant</td><td id="consultant"></td></tr><tr><td>Token</td><td id="token"></td></tr></table><h3>Service Charges</h3><table><thead><tr><th>Service</th><th>Amount</th></tr></thead><tbody id="services"></tbody></table><table><tr class="total"><td>TOTAL PAID</td><td>₹ <span id="total"></span></td></tr></table><table><tr><td>Payment Method</td><td id="method"></td></tr><tr><td>Status</td><td><b style="color:green">PAID</b></td></tr></table><div class="actions"><button onclick="window.print()">🖨 Print</button><button onclick="location.href='../menu.html'">Done</button></div></div><script>
const bill=JSON.parse(sessionStorage.getItem('serviceBill')||'null');const method=sessionStorage.getItem('servicePaymentMethod')||'';const now=new Date();if(!bill){document.body.innerHTML='<h2>Service bill data not found.</h2>';}else{const id='SR-'+now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'-'+Math.floor(1000+Math.random()*9000);document.getElementById('receiptNo').textContent=id;document.getElementById('date').textContent=now.toLocaleDateString();document.getElementById('time').textContent=now.toLocaleTimeString();document.getElementById('patientId').textContent=bill['Patient ID']||'';document.getElementById('patientName').textContent=bill['Patient Name']||'';document.getElementById('appointmentId').textContent=bill['Appointment ID']||'';document.getElementById('department').textContent=bill['Department']||'';document.getElementById('consultant').textContent=bill['Consultant']||'';document.getElementById('token').textContent=bill['Token']||'';document.getElementById('method').textContent=method;document.getElementById('total').textContent=Number(bill.Total||0).toLocaleString('en-IN');document.getElementById('services').innerHTML=(bill.Services||[]).map(x=>`<tr><td>${String(x.Service||'')}</td><td>₹ ${Number(x.Amount||0).toLocaleString('en-IN')}</td></tr>`).join('');}
</script></body></html>
