<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wayfinding</title>
<link rel="stylesheet" href="../style.css">
<style>
.wf{max-width:1000px;margin:auto}.map{display:block;width:100%;max-height:520px;min-height:260px;object-fit:contain;border-radius:16px;margin-top:18px;background:#fff}.card{padding:18px;border-radius:14px;background:rgba(255,255,255,.12);margin-bottom:18px}.voicehint{text-align:center;font-size:20px}.map-status{text-align:center;margin-top:10px;font-size:16px;opacity:.85}
</style>
</head>
<body>
<div class="container"><div class="glass-card wf">
<h1>🧭 Wayfinding</h1>
<div class="card"><h2 id="department">Loading…</h2><p><b>Floor:</b> <span id="floor">-</span></p><p><b>Room:</b> <span id="room">-</span></p><p><b>Directions:</b> <span id="direction">-</span></p></div>
<div class="card"><h2>Hospital Map</h2><img id="hospitalMap" class="map" alt="Hospital wayfinding map"><p id="mapStatus" class="map-status">Loading hospital map…</p><p class="voicehint">Follow the map and directions.</p></div>
</div></div>
<script src="../api.js"></script>
<script>
(async()=>{
  const a=JSON.parse(sessionStorage.getItem('appointment')||'null')||{};
  const dep=a['Department']||a['department']||sessionStorage.getItem('wayfinding_department')||sessionStorage.getItem('neoNanoRecommendedDepartment')||'';
  const saved=JSON.parse(sessionStorage.getItem('voice_autofill')||'{}')||{};
  const department=dep||saved.department||'';
  if(department)sessionStorage.setItem('wayfinding_department',department);
  const imgEl=document.getElementById('hospitalMap');
  const status=document.getElementById('mapStatus');
  if(!department){
    document.getElementById('department').textContent='Hospital Wayfinding';
    status.textContent='Department information is not available.';
    return;
  }
  function showMap(filename){
    if(!filename)return false;
    filename=String(filename).trim();
    if(!filename)return false;
    const encoded=filename.split('/').map(encodeURIComponent).join('/');
    const candidates=['/images/'+encoded,'../images/'+encoded];
    let i=0;
    const tryNext=()=>{
      if(i>=candidates.length){status.textContent='Map image is unavailable. Please follow the directions above.';return;}
      imgEl.onload=()=>{status.textContent='';imgEl.style.display='block';};
      imgEl.onerror=()=>{i++;tryNext();};
      imgEl.src=candidates[i++];
    };
    tryNext();return true;
  }
  try{
    const m=await getDepartmentMap(department)||{};
    document.getElementById('department').textContent=m['Department']||department;
    document.getElementById('floor').textContent=m['Floor']||'-';
    document.getElementById('room').textContent=m['Room No.']||m['Room Number']||'-';
    document.getElementById('direction').textContent=m['Location Details']||m['Directions']||m.direction||'Please follow the hospital signs.';
    const filename=m['More Details']||m['Map Image']||m.image||saved.mapImage||'';
    if(!showMap(filename)) status.textContent='Map image is unavailable. Please follow the directions above.';
  }catch(e){
    document.getElementById('department').textContent=department;
    document.getElementById('direction').textContent='Please follow the hospital signs.';
    status.textContent='Unable to load the hospital map.';
  }
})();

// Demo flow: wayfinding completes automatically after the patient has had time to view the map.
setTimeout(()=>{ window.location.href='thankyou.html'; }, 8000);
</script>

<script src="../gemini_live.js"></script>
</body></html>
