<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Patient Check-in</title><link rel="stylesheet" href="../style.css"><style>.camera-card{max-width:760px;margin:auto;text-align:center}.status{font-size:21px;margin:18px}.small{opacity:.7;font-size:14px}.spinner{width:46px;height:46px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}</style></head>
<body data-no-auto-voice="1">
<div class="container"><div class="glass-card checkin-card camera-card">
<h1>🏥 Patient Check-in</h1><div class="spinner"></div><p id="faceStatus" class="status">Checking your patient record…</p><p class="small">Patient identification is being handled by the hospital system.</p>
<div id="manualChoices" style="display:none;margin-top:15px;gap:10px;justify-content:center;">
  <p>Camera recognition is unavailable. Select user type:</p>
  <button onclick="sessionStorage.setItem('is_new_user','true');sessionStorage.removeItem('patient');location.href='neo_nano_symptoms.html';">New User (Unidentified)</button>
  <button onclick="sessionStorage.setItem('is_new_user','false');location.href='existing_patient.html';" style="background:#103A67;">Existing Patient</button>
</div>
</div></div>
<script src="../gemini_live.js"></script><script src="../face_checkin.js"></script>
</body></html>
